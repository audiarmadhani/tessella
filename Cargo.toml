[package]
name = "tessella"
version = "0.1.0"
edition = "2021"
description = "A native macOS GUI for tuios"
license = "MIT"
repository = "https://github.com/audiarmadhani/tessella"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
toml = "0.8"
toml_edit = "0.22"
objc2 = "0.6"
objc2-foundation = "0.3"
raw-window-handle = "0.6"
alacritty_terminal = "0.26"
# Command Line Tools has no Metal shader compiler, so shaders compile at runtime.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
pulldown-cmark = { version = "0.13.6", default-features = false }

[[bin]]
name = "probe"
path = "src/bin/probe.rs"
